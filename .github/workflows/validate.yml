name: Validate feature vectors

on:
  push:
    branches: [main, feat/source-pinned-feature-vectors-20261110]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -I scripts/check_feature_corpus.py
      - run: python -I scripts/host_evaluator_vectors.py check
